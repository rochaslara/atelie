.tab small{font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:.8}

.tab[aria-selected="true"] .dot{opacity:1}
.tab:focus-visible{outline:2px solid var(--tc);outline-offset:1px}
.hint{flex:none;font:500 10.5px var(--mono);color:var(--muted)}
.frames{position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--stage)}
@media (max-width:760px){.tab small,.hint{display:none}.bar{gap:10px}.brand span{display:none}}

ng:16px}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(380px,100%);display:grid;gap:12px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}\n.card h3{margin:0;font:800 18px/1.2 var(--font-display);letter-spacing:-.01em}\n.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}\n.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}\n.card .result img,.card .result video{max-width:100%;max-height:220px;display:block;margin:0 auto;border-radius:6px}\n.card .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}\n\n@media (prefers-reduced-motion: reduce){.brand .mark{animation:none}}\n@media (max-width: 980px){\n  html,body{height:auto}\n  .app{display:flex;flex-direction:column;height:auto;min-height:100%}\n  .top{flex-wrap:wrap;gap:10px}\n  .stagewrap{order:1}\n  .stage{height:min(78vw,520px);padding:16px}\n  .rail{order:2;border:0;border-bottom:1px solid var(--line);max-height:none}\n  .rail-head{position:static}\n  .tgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));max-height:420px;overflow:auto}\n  .inspector{order:3;border:0}\n}\n@media (max-width: 520px){ .top .label{display:none} }\n\u003c/style>\n\n\u003cdiv class=\"app\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"mark\" aria-hidden=\"true\">\u003c/span>Carrossel\u003c/div>\n    \u003cspan class=\"label\">Canvas\u003c/span>\n    \u003cdiv class=\"seg\" id=\"aspectSeg\" data-bind=\"aspect\" data-options=\"1:1|1:1,4:5|4:5,9:16|9:16,16:9|16:9,4:3|4:3\" role=\"group\" aria-label=\"Canvas ratio\">\u003c/div>\n    \u003cspan class=\"spacer\">\u003c/span>\n    \u003cbutton class=\"btn primary\" id=\"exportTop\">Export \u003cspan class=\"mono\" id=\"exportTopFmt\">MP4\u003c/span>\u003c/button>\n  \u003c/header>\n\n  \u003caside class=\"rail\" aria-label=\"Templates\">\n    \u003cdiv class=\"rail-head\">\n      \u003ch2>All templates\u003c/h2>\n      \u003cinput type=\"search\" class=\"search\" id=\"tplSearch\" placeholder=\"Search templates\" aria-label=\"Search templates\">\n      \u003cdiv class=\"chips\" id=\"cats\" role=\"group\" aria-label=\"Template categories\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"tgrid\" id=\"presetList\">\u003c/div>\n  \u003c/aside>\n\n  \u003cmain class=\"stagewrap\">\n    \u003cdiv class=\"stage\" id=\"stage\">\n      \u003cspan class=\"dims mono\" id=\"dims\">\u003c/span>\n      \u003cspan class=\"tplname\" id=\"tplName\">\u003c/span>\n      \u003ccanvas id=\"view\" aria-label=\"Animation preview\">\u003c/canvas>\n      \u003cdiv class=\"overlay\" id=\"overlay\" hidden>\n        \u003cdiv class=\"card\" role=\"dialog\" aria-live=\"polite\">\n          \u003ch3 id=\"ovTitle\">Rendering\u003c/h3>\n          \u003cdiv class=\"bar\">\u003ci id=\"ovBar\">\u003c/i>\u003c/div>\n          \u003cp class=\"note mono\" id=\"ovStatus\">\u003c/p>\n          \u003cdiv class=\"result\" id=\"ovResult\">\u003c/div>\n          \u003cdiv class=\"acts\">\n            \u003cbutton class=\"btn\" id=\"ovCancel\">Cancel\u003c/button>\n            \u003cbutton class=\"btn primary\" id=\"ovSave\" hidden>Save file\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"transport\">\n      \u003cbutton class=\"play\" id=\"playBtn\" aria-label=\"Pause\">\u003csvg viewBox=\"0 0 14 14\" id=\"playIcon\">\u003crect x=\"2\" y=\"1\" width=\"3.5\" height=\"12\" rx=\"1\"/>\u003crect x=\"8.5\" y=\"1\" width=\"3.5\" height=\"12\" rx=\"1\"/>\u003c/svg>\u003c/button>\n      \u003cinput type=\"range\" id=\"scrub\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"Timeline\">\n      \u003cspan class=\"time mono\" id=\"time\">0.00 / 12.00 s\u003c/span>\n    \u003c/div>\n  \u003c/main>\n\n  \u003caside class=\"inspector\" aria-label=\"Settings\">\n    \u003csection class=\"sec\">\n      \u003cdiv class=\"sec-head\">\u003ch2>Images\u003c/h2>\u003cspan class=\"count\" id=\"count\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"add\">\n        \u003cbutton class=\"btn\" id=\"addBtn\">+ Add images\u003c/button>\n        \u003cinput type=\"file\" id=\"fileIn\" accept=\"image/*\" multiple hidden>\n      \u003c/div>\n      \u003cdiv class=\"thumbs\" id=\"thumbs\">\u003c/div>\n      \u003cdiv class=\"framer\" id=\"framer\" hidden>\n        \u003cdiv class=\"framer-head\">\n          \u003cspan class=\"framer-title\">\u003cspan class=\"lbl\">Position in card\u003c/span>\u003cb id=\"frName\">\u003c/b>\u003c/span>\n          \u003cspan class=\"framer-nav\">\u003cbutton class=\"btn ghost\" id=\"frPrev\" aria-label=\"Previous image\">\u2039\u003c/button>\u003cbutton class=\"btn ghost\" id=\"frNext\" aria-label=\"Next image\">\u203a\u003c/button>\u003c/span>\n        \u003c/div>\n        \u003ccanvas id=\"frCanvas\" tabindex=\"0\" aria-label=\"Image position. Drag or use the arrow keys to move the image, plus and minus to zoom, 0 to reset.\">\u003c/canvas>\n        \u003cdiv class=\"row\">\u003clabel for=\"frZoom\">Zoom\u003c/label>\u003cinput type=\"range\" id=\"frZoom\" min=\"1\" max=\"4\" step=\"0.01\" value=\"1\">\u003coutput data-unit=\"\u00d7\">\u003c/output>\u003c/div>\n        \u003cp class=\"note\" id=\"frHint\">\u003c/p>\n        \u003cdiv class=\"add\">\u003cbutton class=\"btn ghost\" id=\"frReset\">Reset\u003c/button>\u003cbutton class=\"btn\" id=\"frDone\">Done\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"note\">Click a thumbnail to show or hide it, and drag to reorder. Use the arrows button on a thumbnail to move the image inside its card. You can also drop or paste images onto the stage.\u003c/p>\n      \u003cdiv class=\"add\">\n        \u003cbutton class=\"btn ghost\" id=\"allBtn\">Show all\u003c/button>\n        \u003cbutton class=\"btn ghost\" id=\"noneBtn\">Hide all\u003c/button>\n        \u003cbutton class=\"btn ghost\" id=\"clearBtn\">Remove all\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"sec\">\n      \u003ch2>Cards\u003c/h2>\n      \u003cdiv class=\"field\">\u003cspan class=\"lbl\">Card ratio\u003c/span>\u003cdiv class=\"seg\" data-bind=\"card.shape\" data-options=\"1:1|1:1,4:5|4:5,3:4|3:4,4:3|4:3,16:9|16:9,9:16|9:16\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"row\">\u003clabel for=\"cSize\">Size\u003c/label>\u003cinput type=\"range\" id=\"cSize\" data-bind=\"card.size\" min=\"15\" max=\"95\" step=\"1\">\u003coutput data-unit=\"%\">\u003c/output>\u003c/div>\n      \u003cdiv class=\"row\">\u003clabel for=\"cRadius\">Corners\u003c/label>\u003cinput type=\"range\" id=\"cRadius\" data-bind=\"card.radius\" min=\"0\" max=\"30\" step=\"1\">\u003coutput data-unit=\"\">\u003c/output>\u003c/div>\n      \u003cdiv class=\"row\">\u003clabel for=\"cGap\">Spacing\u003c/label>\u003cinput type=\"range\" id=\"cGap\" data-bind=\"card.gap\" min=\"0\" max=\"20\" step=\"0.5\">\u003coutput data-unit=\"\">\u003c/output>\u003c/div>\n      \u003cdiv class=\"row\">\u003clabel for=\"cShadow\">Shadow\u003c/label>\u003cinput type=\"range\" id=\"cShadow\" data-bind=\"card.shadow\" min=\"0\" max=\"100\" step=\"1\">\u003coutput data-unit=\"%\">\u003c/output>\u003c/div>\n      \u003cdiv class=\"check\">\u003clabel for=\"cOutline\" class=\"lbl\">Thin outline\u003c/label>\u003cspan class=\"switch\">\u003cinput type=\"checkbox\" id=\"cOutline\" data-bind=\"card.outline\">\u003ci>\u003c/i>\u003c/span>\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"sec\">\n      \u003ch2>Motion\u003c/h2>\n      \u003cdiv class=\"row\">\u003clabel for=\"mSec\">Time per card\u003c/label>\u003cinput type=\"range\" id=\"mSec\" data-bind=\"motion.sec\" min=\"0.6\" max=\"5\" step=\"0.1\">\u003coutput data-unit=\"s\">\u003c/output>\u003c/div>\n      \u003cdiv class=\"field\" data-when=\"kind=step\">\u003cspan class=\"lbl\">Easing\u003c/span>\u003cdiv class=\"seg\" data-bind=\"motion.ease\" data-options=\"linear|Linear,smooth|Smooth,snappy|Snappy,back|Bounce\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"row\" data-when=\"kind=step\">\u003clabel for=\"mHold\">Pause\u003c/label>\u003cinput type=\"range\" id=\"mHold\" data-bind=\"motion.hold\" min=\"0\" max=\"85\" step=\"1\">\u003coutput data-unit=\"%\">\u003c/output>\u003c/div>\n      \u003cdiv class=\"row\" data-when=\"preset=depthField\">\u003clabel for=\"mCrowd\">Frames\u003c/label>\u003cinput type=\"range\" id=\"mCrowd\" data-bind=\"motion.crowd\" min=\"10\" max=\"160\" step=\"1\">\u003coutput data-unit=\"\">\u003c/output>\u003c/div>\n      \u003cdiv class=\"row\" data-when=\"preset=depthField\">\u003clabel for=\"mHole\">Empty center\u003c/label>\u003cinput type=\"range\" id=\"mHole\" data-bind=\"motion.hole\" min=\"0\" max=\"85\" step=\"1\">\u003coutput data-unit=\"%\">\u003c/output>\u003c/div>\n      \u003cdiv class=\"row\">\u003clabel for=\"mTilt\">Tilt\u003c/label>\u003cinput type=\"range\" id=\"mTilt\" data-bind=\"motion.tilt\" min=\"-30\" max=\"30\" step=\"1\">\u003coutput data-unit=\"\u00b0\">\u003c/output>\u003c/div>\n      \u003cdiv class=\"check\">\u003clabel for=\"mRev\" class=\"lbl\">Reverse direction\u003c/label>\u003cspan class=\"switch\">\u003cinput type=\"checkbox\" id=\"mRev\" data-bind=\"motion.reverse\">\u003ci>\u003c/i>\u003c/span>\u003c/div>\n      \u003cp class=\"note mono\" id=\"motionNote\">\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"sec\">\n      \u003cdiv class=\"sec-head\">\u003ch2>Background\u003c/h2>\u003cspan class=\"switch\">\u003cinput type=\"checkbox\" id=\"bgOn\" data-bind=\"bg.on\" aria-label=\"Background on\">\u003ci>\u003c/i>\u003c/span>\u003c/div>\n      \u003cdiv data-when=\"bg.on=true\" style=\"display:grid;gap:12px\">\n        \u003cdiv class=\"seg\" data-bind=\"bg.type\" data-options=\"solid|Solid,gradient|Gradient,glow|Glow,image|Image\">\u003c/div>\n        \u003cdiv class=\"row two\" data-when=\"bg.type=solid|gradient|glow\">\u003clabel for=\"bgC1\">Color 1\u003c/label>\u003cdiv class=\"color\">\u003cinput type=\"color\" id=\"bgC1\" data-bind=\"bg.c1\">\u003cinput type=\"text\" data-hex=\"bg.c1\" aria-label=\"Color 1 hex\" maxlength=\"7\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"row two\" data-when=\"bg.type=gradient|glow\">\u003clabel for=\"bgC2\">Color 2\u003c/label>\u003cdiv class=\"color\">\u003cinput type=\"color\" id=\"bgC2\" data-bind=\"bg.c2\">\u003cinput type=\"text\" data-hex=\"bg.c2\" aria-label=\"Color 2 hex\" maxlength=\"7\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"row\" data-when=\"bg.type=gradient\">\u003clabel for=\"bgAng\">Angle\u003c/label>\u003cinput type=\"range\" id=\"bgAng\" data-bind=\"bg.angle\" min=\"0\" max=\"360\" step=\"5\">\u003coutput data-unit=\"\u00b0\">\u003c/output>\u003c/div>\n        \u003cdiv class=\"swatches\" id=\"swatches\" data-when=\"bg.type=solid|gradient|glow\">\u003c/div>\n        \u003cdiv data-when=\"bg.type=image\" style=\"display:grid;gap:12px\">\n          \u003cbutton class=\"btn\" id=\"bgImgBtn\">Choose background image\u003c/button>\n          \u003cinput type=\"file\" id=\"bgFile\" accept=\"image/*\" hidden>\n          \u003cdiv class=\"row\">\u003clabel for=\"bgBlur\">Blur\u003c/label>\u003cinput type=\"range\" id=\"bgBlur\" data-bind=\"bg.blur\" min=\"0\" max=\"40\" step=\"1\">\u003coutput data-unit=\"\">\u003c/output>\u003c/div>\n          \u003cdiv class=\"row\">\u003clabel for=\"bgDim\">Darken\u003c/label>\u003cinput type=\"range\" id=\"bgDim\" data-bind=\"bg.dim\" min=\"0\" max=\"80\" step=\"1\">\u003coutput data-unit=\"%\">\u003c/output>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"row\">\u003clabel for=\"bgGrain\">Grain\u003c/label>\u003cinput type=\"range\" id=\"bgGrain\" data-bind=\"bg.grain\" min=\"0\" max=\"100\" step=\"1\">\u003coutput data-unit=\"%\">\u003c/output>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"note\" data-when=\"bg.on=false\">Background off: GIF exports with transparency. MP4 can't store transparency, so it renders on black.\u003c/p>\n .kind==='gif'?`\u003cimg src=\"${url}\" alt=\"Exported GIF preview\">`:`\u003cvideo src=\"${url}\" autoplay loop muted playsinline>\u003c/video>`;\n    $('#ovSave').hidden=false;$('#ovSave').textContent=`Save ${res.ext.toUpperCase()}`;$('#ovCancel').textContent='Close';\n    const r=await saveBlob(res.blob,res.filename);\n    if(r==='declined')$('#ovStatus').textContent+=' \u00b7 save declined, press Save to try again';else if(r==='saved')$('#ovStatus').textContent+=' \u00b7 saved';else if(r==='large')$('#ovStatus').textContent+=' \u00b7 too large for this view, try a smaller width';\n  }catch(e){$('#ovTitle').textContent='Export failed';$('#ovStatus').textContent=String(e&&e.message||e);$('#ovCancel').textContent='Close'}\n  finally{exporting=false;if(GL)GL.shrink(view.width,view.height)}}\nfunction stamp(){const d=new Date();const z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`}\nconst fname=ext=>`carrossel-${S.preset}-${stamp()}.${ext}`;\nasync function exportGif(){\n  const {w,h}=expDims(),fps=S.exp.fps,frames=Math.max(2,Math.round(loopLen()*fps)),delay=Math.max(2,Math.round(100/fps));\n  const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});const transparent=!S.bg.on;\n  const hist=GIF.Hist();const samples=Math.min(frames,16);\n  for(let i=0;i\u003csamples;i++){if(cancelFlag)return null;renderFrame(ctx,w,h,i/samples);GIF.addToHist(hist,ctx.getImageData(0,0,w,h).data);ov.prog(.1*i/samples,'Building palette\u2026');await yieldUI()}\n  const enc=new GIF.Encoder(w,h,GIF.buildPalette(hist,transparent?255:256),{transparent,delayCs:delay});\n  for(let i=0;i\u003cframes;i++){if(cancelFlag)return null;renderFrame(ctx,w,h,i/frames);enc.addFrame(ctx.getImageData(0,0,w,h).data,S.exp.dither);ov.prog(.1+.9*(i+1)/frames,`Frame ${i+1} / ${frames}`);await yieldUI()}\n  return{blob:new Blob([enc.finish()],{type:'image/gif'}),kind:'g d video format in this browser.');\n  const ext=mime.startsWith('video/mp4')?'mp4':'webm';const rec=new MediaRecorder(c.captureStream(fps),{mimeType:mime,videoBitsPerSecond:Math.round(w*h*fps*.25)});const chunks=[];\n  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise(r=>rec.onstop=r);renderFrame(ctx,w,h,0,{forceOpaque:true});rec.start(250);const t0=performance.now();\n  await new Promise(res=>{const step=()=>{if(cancelFlag)return res();const el=(performance.now()-t0)/1000,i=Math.floor(el*fps);if(i>=frames)return res();\n    renderFrame(ctx,w,h,(i%per)/per,{forceOpaque:true});ov.prog(i/frames,`Recording in real time \u00b7 ${el.toFixed(1)} s${ext==='webm'?' \u00b7 WebM (MP4 not supported here)':''}`);requestAnimationFrame(step)};step()});\n  rec.stop();await done;if(cancelFlag)return null;return{blob:new Blob(chunks,{type:mime.split(';')[0]}),kind:'video',ext,filename:fname(ext)}}\n\n/* ============================== Wiring ============================== */\nfunction wire(){\n  $('#addBtn').addEventListener('click',()=>$('#fileIn').click());\n  $('#fileIn').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});\n  $('#allBtn').addEventListener('click',()=>{images.forEach(i=>i.on=true);renderThumbs();persist()});\n  $('#noneBtn').addEventListener('click',()=>{images.forEach(i=>i.on=false);renderThumbs();persist()});\n  $('#clearBtn').addEventListener('click',()=>{images=[];renderThumbs();persist()});\n  $('#bgImgBtn').addEventListener('click',()=>$('#bgFile').click());\n  $('#bgFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const b=await fromBlob(f,'bg');bgImage={src:b.src,w:b.w,h:b.h,blob:f,anim:b.anim};persist();queueThumbs()}catch(err){}});\n  const sw=$('#swatches');SWATCHES.forEach(([a,b])=>{const x=document.createElement('button');x.type='button';x.style.background=`linear-gradient(135deg,${a} 50%,${b} 50%)`;x.setAttribute('aria-label',`Colors ${a} and ontrol rail on the right (sibling of Loopwash). */\n:root{\n  --bg:#eeedf0; --panel:#fcfbfd; --sunk:#e5e3e9; --line:#d8d5de; --line-strong:#bcb8c5;\n  --text:#18161c; --muted:#655f6f; --faint:#8e8899;\n  --accent:#c2185b; --accent-ink:#ffffff; --accent-soft:#f8dde8;\n  --ok:#1d7a4f; --warn:#a4541a; --stage:#dcd9e0;\n  --sans:\"Schibsted Grotesk\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --mono:\"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme:dark;\n    --bg:#0f0e12; --panel:#17151b; --sunk:#1f1c24; --line:#2a2630; --line-strong:#3f3a47;\n    --text:#ebe8ef; --muted:#9a93a6; --faint:#6e6879;\n    --accent:#ff6fa4; --accent-ink:#17151b; --accent-soft:#3a1f2c;\n    --ok:#5fcf97; --warn:#f0a36a; --stage:#09080b;\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#0f0e12; --panel:#17151b; --sunk:#1f1c24; --line:#2a2630; --line-strong:#3f3a47;\n  --text:#ebe8ef; --muted:#9a93a6; --faint:#6e6879;\n  --accent:#ff6fa4; --accent-ink:#17151b; --accent-soft:#3a1f2c;\n  --ok:#5fcf97; --warn:#f0a36a; --stage:#09080b;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;padding:0 20px;padding-block:18px 40px}\nbutton,input,select,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n\n.top{max-width:1400px;margin:0 auto 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.mark{display:flex;align-items:center;gap:10px}\n.mark-dot{width:22px;height:22px;border-radius:4px;background:radial-gradient(circle,var(--accent) 38%,transparent 42%) 0 0/5.5px 5.5px}\n.mark h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}\n.top p{margin:0;color:var(--muted);font-size:13px}\n.top .spacer{flex:1}\n.kbd{font-family:var(--mono);font-size:11px;color:var(--f ar(--accent-soft);color:var(--text)}\n\n.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}\n.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}\n.ctl label,.lbl{font-size:13px;font-weight:500}\n.ctl output{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}\ninput[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;margin:0}\ninput[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--line) var(--p,50%))}\ninput[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}\ninput[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}\ninput[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);margin-top:-6px}\ninput[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}\n.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}\n\n.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px}\n.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;font-size:13px;font-weight:500;color:var(--muted)}\n.seg button[aria-pressed=\"true\"]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}\n.field{display:flex;flex-direction:column;gap:4px;min-width:0}\n.field label{font-size:12px;color:var(--muted)}\nselect,textarea{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:7px 8px;font-size:13px}\ntextarea{resize:vertical;min-height:64px;font-family:var(--mono);font-size:13px;line-height:1.4}\nselect:focus,textarea:focus{border-color:var(--accent);outline:none}\n.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}\n.drop{border:1.5px dashed var(--line-strong);border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;background:none;text-align:left;width:100%}\n.drop:hover{border-color:var(--accent)}\n.drop canvas{width:48px;height:48px;border-radius:6px;flex:none;background:#000}\n.drop .t{display:flex;flex-direction:column;gap:2px;min-width:0}\n.drop b{font-weight:600;font-size:13px}\n.drop small{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.summary{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.6}\n.fontpick{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}\n.fp-current{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--sunk);min-width:0}\n.fp-current b{font-size:22px;font-weight:400;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}\n.fp-current small{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;flex:none}\n.fp-search{border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);padding:9px 12px;font-size:13px;width:100%;min-width:0}\n.fp-search:focus{outline:none;background:var(--accent-soft)}\n.fp-cats{display:flex;gap:4px;padding:8px 8px 6px;overflow-x:auto;scrollbar-width:none}\n.fp-cats button{border:1px solid var(--line);background:none;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}\n.fp-cats button[aria-pressed=\"true\"]{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}\n.fp-list{height:230px;overflow-y:auto;display:flex;flex-direction:column;padding:2px 4px 6px;overscroll-behavior:contain}\n.fp-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:7px;min-width:0}\n.fp-row span{font-size:19px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}\n.fp-row small{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;flex:none}\n.fp-row:hover{background:var(--sunk)}\n.fp-row[aria-selected=\"true\"]{background:var(--accent-soft)}\n.fp-row.missing span{opacity:.4}\n.fp-row.load span{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--accent)}\n.fp-foot{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:6px 12px;border-top:1px solid var(--line)}\n.fp-note{font-size:12px;color:var(--warn);margin:0;min-height:0}\n.primary{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);padding:12px 14px;font-weight:600;font-size:14px}\n.primary:hover:not(:disabled){filter:brightness(1.08)}\n.primary:disabled{opacity:.55;cursor:default}\n.progress{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}\n.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}\n.status{font-size:12.5px;color:var(--muted);min-height:1.2em;margin:0}\n.status.err{color:var(--warn)}\n.status.ok{color:var(--ok)}\n.result{display:flex;gap:12px;align-items:center;background:var(--sunk);border-radius:10px;padding:10px}\n.result .thumb{width:84px;flex:none;border-radius:5px;display:block;background:#000}\n.result .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}\n.result .name{font-family:var(--mono);font-size:11.5px;word-break:break-all}\n.save-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.save-name{display:flex;gap:6px;margin-top:10px}\n.save-name input{flex:1;min-width:0;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:6px 9px;font-size:13px}\n.save-name input:focus{border-color:var(--accent);outline:none}\n@media (prefers-reduced-motion:reduce){.preset canvas{transition:none}}\n\u003c/style>\n\n\u003cheader class=\"top\">\n  \u003cdiv class=\"mark\">\u003cdiv class=\"mark-dot\" aria-hidden=\"true\">\u003c/div>\u003ch1>Dotwash\u003c/h1>\u003c/div>\n  \u003cp>Halftone loops from patterns, type and images. Export as GIF, MP4 or PNG.\u003c/p>\n  \u003cdiv class=\"spacer\">\u003c/div>\n  \u003cspan class=\"kbd\">Space \u00b7 play/pause \u00b7 drop an image on the preview\u003c/span>\n\u003c/header>\n\n\u003cmain class=\"app\">\n  \u003csection class=\"stage-col\" aria-label=\"Preview\">\n    \u003cdiv class=\"stage\" id=\"stage\">\n      \u003ccanvas id=\"view\" aria-label=\"Live halftone preview\">\u003c/canvas>\n      \u003cdiv class=\"stage-meta\">\u003cspan id=\"metaDims\">640 \u00d7 640\u003c/span>\u003cspan id=\"metaStyle\">Blobs \u00b7 Circle\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"transport\">\n      \u003cbutton class=\"icon-btn\" id=\"playBtn\" aria-label=\"Pause\">\u003csvg viewBox=\"0 0 14 14\" id=\"playIcon\">\u003crect x=\"2\" y=\"1\" width=\"3.5\" height=\"12\" rx=\"1\"/>\u003crect x=\"8.5\" y=\"1\" width=\"3.5\" height=\"12\" rx=\"1\"/>\u003c/svg>\u003c/button>\n      \u003cinput type=\"range\" class=\"scrub\" id=\"scrub\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"Loop position\">\n      \u003cspan class=\"tc\" id=\"tc\">\u003cb>00:00:00\u003c/b> / 00:06:00\u003c/span>\n      \u003cspan class=\"chip\" title=\"The last frame flows straight into the first\">Seamless loop\u003c/span>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv class=\"section-h\">\u003ch2>Presets\u003c/h2>\u003cbutton class=\"link-btn\" id=\"savePresetToggle\">Save current as preset\u003c/button>\u003c/div>\n      \u003cdiv class=\"save-name\" id=\"saveNameRow\" hidden>\n        \u003cinput id=\"presetName\" type=\"text\" placeholder=\"Preset name\" maxlength=\"28\" aria-label=\"Preset name\">\n        \u003cbutton class=\"pill-btn\" id=\"savePresetBtn\">Save\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"presets\" id=\"presets\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003caside class=\"panel\" aria-label=\"Controls\">\n    \u003cdiv class=\"group\">\n      \u003cdiv class=\"section-h\">\u003ch2>Source\u003c/h2>\u003cspan class=\"aside\" id=\"srcAside\">Generated pattern\u003c/span>\u003c/div>\n      \u003cdiv class=\"seg\" id=\"srcSeg\">\u003cbutton data-v=\"pattern\">Pattern\u003c/button>\u003cbutton data-v=\"text\">Text\u003c/button>\u003cbutton data-v=\"image\">Image\u003c/button>\u003c/div>\n      \u003cdiv class=\"stack\" id=\"textCtls\">\n        \u003cdiv class=\"field\">\u003clabel for=\"textIn\">Text (new line for each row)\u003c/label>\u003ctextarea id=\"textIn\" rows=\"2\" spellcheck=\"false\">\u003c/textarea>\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"fontSearch\">Typeface \u00b7 Google Fonts\u003c/label>\n          \u003cdiv class=\"fontpick\">\n            \u003cdiv class=\"fp-current\">\u003cb id=\"fpCurName\">Anton\u003c/b>\u003csmall id=\"fpCurMeta\">Display \u00b7 400\u003c/small>\u003c/div>\n            \u003cinput id=\"fontSearch\" class=\"fp-search\" type=\"search\" placeholder=\"Search families, or type any Google Fonts name\" autocomplete=\"off\" spellcheck=\"false\">\n            \u003cdiv class=\"fp-cats\" id=\"fontCats\">\u003c/div>\n            \u003cdiv class=\"fp-list\" id=\"fontList\" role=\"listbox\" aria-label=\"Google Fonts families\">\u003c/div>\n            \u003cdiv class=\"fp-foot\" id=\"fontFoot\">\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"fp-note\" id=\"fontNote\" role=\"status\">\u003c/p>\n        \u003cdiv class=\"field\">\u003clabel for=\"weightSel\">Weight\u003c/label>\n          \u003cselect id=\"weightSel\">\n            \u003coption value=\"100\">100 Thin\u003c/option>\u003coption value=\"200\">200 Extra Light\u003c/option>\u003coption value=\"300\">300 Light\u003c/option>\u003coption value=\"400\">400 Regular\u003c/option>\n            \u003coption value=\"500\">500 Medium\u003c/option>\u003coption value=\"600\">600 Semibold\u003c/option>\u003coption value=\"700\">700 Bold\u003c/option>\u003coption value=\"800\">800 Extra Bold\u003c/option>\u003coption value=\"900\">900 Black\u003c/option>\n          \u003c/select>\u003c/div>\n        \u003cdiv class=\"stack\" id=\"textSliders\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stack\" id=\"imageCtls\">\n        \u003cbutton class=\"drop\" id=\"dropBtn\" type=\"button\">\u003ccanvas id=\"imgThumb\" width=\"96\" height=\"96\">\u003c/canvas>\u003cspan class=\"t\">\u003cb>Choose an image\u003c/b>\u003csmall id=\"imgName\">Sample image\u003c/small>\u003c/span>\u003c/button>\n        \u003cinput type=\"file\" id=\"fileIn\" accept=\"image/*\" hidden>\n        \u003cdiv class=\"two\">\n          \u003cdiv class=\"ctl\">\u003cspan class=\"lbl\">Fit\u003c/span>\u003cdiv class=\"seg\" id=\"fitSeg\">\u003cbutton data-v=\"cover\">Fill\u003c/button>\u003cbutton data-v=\"contain\">Fit\u003c/button>\u003c/div>\u003c/div>\n          \u003cdiv class=\"ctl\">\u003cspan class=\"lbl\">Dot color\u003c/span>\u003cdiv class=\"seg\" id=\"imgColorSeg\">\u003cbutton data-v=\"0\">Palette\u003c/button>\u003cbutton data-v=\"1\">Image\u003c/button>\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"stack\" id=\"imageSliders\">\u003c/div>\n      \u003c/div>\n      \u003cp class=\"hint\" id=\"srcHint\">\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"group\">\n      \u003cdiv class=\"section-h\">\u003ch2>Motion\u003c/h2>\u003cspan class=\"aside\" id=\"motionName\">Blobs\u003c/span>\u003c/div>\n      \u003cdiv class=\"styles\" id=\"styles\">\u003c/div>\n      \u003cp class=\"hint\" id=\"motionHint\">\u003c/p>\n      \u003cdiv class=\"stack\" id=\"motionCtls\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"group\">\n      \u003cdiv class=\"section-h\">\u003ch2>Halftone\u003c/h2>\u003cspan class=\"aside\" id=\"shapeName\">Circle\u003c/span>\u003c/div>\n      \u003cdiv class=\"shapes\" id=\"shapes\">\u003c/div>\n      \u003cdiv class=\"stack\" id=\"dotCtls\">\u003c/div>\n      \u003cdiv class=\"two\">\n        \u003cdiv class=\"ctl\">\u003cspan class=\"lbl\">Dots on\u003c/span>\u003cdiv class=\"seg\" id=\"invertSeg\">\u003cbutton data-v=\"0\">Light\u003c/button>\u003cbutton data-v=\"1\">Dark\u003c/button>\u003c/div>\u003c/div>\n        \u003cdiv class=\"ctl\">\u003cspan class=\"lbl\">Edges\u003c/span>\u003cdiv class=\"seg\" id=\"crispSeg\">\u003cbutton data-v=\"0\">Smooth\u003c/button>\u003cbutton data-v=\"1\">Crisp\u003c/button>\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"group\">\n      \u003cdiv class=\"section-h\">\u003ch2>Colors\u003c/h2>\u003c/div>\n      \u003cdiv class=\"palettes\" id=\"palettes\" aria-label=\"Quick palettes\">\u003c/div>\n      \u003cdiv class=\"stack\" id=\"colors\" style=\"gap:8px\">\u003c/div>\n      \u003cdiv class=\"color-actions\">\n        \u003cbutton class=\"pill-btn\" id=\"twoToneBtn\" aria-pressed=\"false\">Two-tone dots\u003c/button>\n        \u003cbutton class=\"pill-btn\" id=\"swapBtn\">Swap background and ink\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"group\">\n      \u003cdiv class=\"section-h\">\u003ch2>Export\u003c/h2>\u003c/div>\n      \u003cdiv class=\"seg\" id=\"formatSeg\">\u003cbutton data-v=\"gif\">GIF\u003c/button>\u003cbutton data-v=\"mp4\">MP4\u003c/button>\u003cbutton data-v=\"png\">PNG still\u003c/button>\u003c/div>\n      \u003cdiv class=\"grid3\">\n        \u003cdiv class=\"field\">\u003clabel for=\"aspect\">Ratio\u003c/label>\n          \u003cselect id=\"aspect\">\u003coption>1:1\u003c/option>\u003coption>4:5\u003c/option>\u003coption>16:9\u003c/option>\u003coption>9:16\u003c/option>\u003coption>3:2\u003c/option>\u003c/select>\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"size\">Long side\u003c/label>\u003cselect id=\"size\">\u003c/select>\u003c/div>\n        \u003cdiv class=\"field\" id=\"fpsField\">\u003clabel for=\"fps\">Frame rate\u003c/label>\u003cselect id=\"fps\">\u003c/select>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"summary\" id=\"summary\">\u003c/div>\n      \u003cbutton class=\"primary\" id=\"exportBtn\">Export GIF\u003c/button>\n      \u003cdiv class=\"progress\" id=\"progress\" hidden>\u003ci id=\"progressBar\">\u003c/i>\u003c/div>\n      \u003cp class=\"status\" id=\"status\" role=\"status\">\u003c/p>\n      \u003cdiv class=\"result\" id=\"result\" hidden>\n        \u003cdiv id=\"resultThumb\">\u003c/div>\n        \u003cdiv class=\"info\">\n          \u003cdiv class=\"name\" id=\"resultName\">\u003c/div>\n          \u003cdiv class=\"save-row\">\u003cbutton class=\"pill-btn\" id=\"saveAgain\">Save file\u003c/button>\u003cspan class=\"summary\" id=\"resultSize\">\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/aside>\n\u003c/main>\n\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js\">\u003c/script>\n\u003cscript>\n(() => {\n\"use strict\";\nconst $ = id => document.getElementById(id);\n\n/* ---------- Color helpers ---------- */\nfunction hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }\nconst hex01 = h => hexToRgb(h).map(v=>v/255);\nconst validHex = h => /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h);\nconst normHex = h => { h=h.trim(); if(!h.startsWith('#')) h='#'+h; if(h.length===4) h='#'+h.slice(1).split('').map(x=>x+x).join(''); return h.toLowerCase(); };\n\n/* ---------- Google Fonts catalogue (s sans, r serif, d display, h handwriting, m mono) ---------- */\nconst FONT_DATA = {\ns:\"ABeeZee,Abel,Advent Pro,Afacad,Alata,Albert Sans,Aldrich,Alegreya Sans,Alegreya Sans SC,Alexandria,Almarai,Amiko,Anaheim,Andika,Anek Latin,Antic,Anuphan,Anybody,Archivo,Archivo Narrow,Arimo,Armata,Arsenal,Asap,Asap Condensed,Assista }\n.style-btn span{font-size:12px;font-weight:500;text-align:center;color:var(--muted)}\n.style-btn[aria-pressed=\"true\"]{border-color:var(--accent);background:var(--accent-soft)}\n.style-btn[aria-pressed=\"true\"] span{color:var(--text)}\n\n.colors{display:flex;flex-direction:column;gap:6px}\n.color-row{display:grid;grid-template-columns:34px 1fr auto auto auto;gap:6px;align-items:center}\n.swatch{position:relative;width:34px;height:30px;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}\n.swatch input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:0;padding:0;cursor:pointer;opacity:0}\n.hex{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;background:var(--sunk);border:1px solid transparent;border-radius:7px;padding:5px 8px;width:100%;min-width:0}\n.hex:focus{border-color:var(--accent);outline:none}\n.role{font-size:11px;color:var(--faint);white-space:nowrap;min-width:0}\n.mini{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center;font-size:14px;line-height:1}\n.mini:hover:not(:disabled){border-color:var(--line-strong);color:var(--text)}\n.mini:disabled{opacity:.35;cursor:default}\n.color-actions{display:flex;gap:8px;flex-wrap:wrap}\n.pill-btn{border:1px solid var(--line-strong);background:none;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:500}\n.pill-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}\n.pill-btn:disabled{opacity:.4;cursor:default}\n.ramp{height:10px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}\n\n.ctl{display:flex;flex-direction:column;gap:4px}\n.ctl[hidden]{display:none!important}\n.ctl-top{display:flex;justify-content:space-between;align-items:baseline}\n.ctl label{font-size:13px;font-weight:500}\n.ctl output{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}\ninput[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;margin:0}\ninput[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--line) var(--p,50%))}\ninput[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}\ninput[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}\ninput[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);margin-top:-6px}\ninput[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n\n.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px}\n.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;font-size:13px;font-weight:500;color:var(--muted)}\n.seg button[aria-pressed=\"true\"]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}\n.field{display:flex;flex-direction:column;gap:4px;min-width:0}\n.field label{font-size:12px;color:var(--muted)}\nselect{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:7px 8px;font-size:13px}\nselect:focus{border-color:var(--accent);outline:none}\n.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}\n.summary{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.6}\n.primary{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);padding:12px 14px;font-weight:600;font-size:14px}\n.primary:hover:not(:disabled){filter:brightness(1.08)}\n.primary:disabled{opacity:.55;cursor:default}\n.progress{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}\n.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}\n.status{font-size:12.5px;color:var(--muted);min-height:1.2em;margin:0}\n.status.err{color:var(--warn)}\n.status.ok{color:var(--ok)}\n.result{display:flex;gap:12px;align-items:center;background:var(--sunk);border-radius:10px;padding:10px}\n.result .thumb{width:96px;flex:none;border-radius:5px;display:block;background:#000}\n.result .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}\n.result .name{font-family:var(--mono);font-size:11.5px;word-break:break-all}\n.save-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.save-name{display:flex;gap:6px}\n.save-name input{flex:1;min-width:0;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:6px 9px;font-size:13px}\n.save-name input:focus{border-color:var(--accent);outline:none}\n@media (prefers-reduced-motion:reduce){.preset canvas{transition:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\n\u003cheader class=\"top\">\n  \u003cdiv class=\"mark\">\u003cdiv class=\"mark-dot\" id=\"markDot\" aria-hidden=\"true\">\u003c/div>\u003ch1>Loopwash\u003c/h1>\u003c/div>\n  \u003cp>Seamless gradient loops for backgrounds, exported as GIF or MP4.\u003c/p>\n  \u003cdiv class=\"spacer\">\u003c/div>\n  \u003cspan class=\"kbd\">Space \u00b7 play/pause\u003c/span>\n\u003c/header>\n\n\u003cmain class=\"app\">\n  \u003csection class=\"stage-col\" aria-label=\"Preview\">\n    \u003cdiv class=\"stage\" id=\"stage\">\n      \u003ccanvas id=\"view\" aria-label=\"Live gradient preview\">\u003c/canvas>\n      \u003cdiv class=\"stage-meta\">\u003cspan id=\"metaDims\">1920 \u00d7 1080\u003c/span>\u003cspan id=\"metaStyle\">Arcs\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"transport\">\n      \u003cbutton class=\"icon-btn\" id=\"playBtn\" aria-label=\"Pause\">\u003csvg viewBox=\"0 0 14 14\" id=\"playIcon\">\u003crect x=\"2\" y=\"1\" width=\"3.5\" height=\"12\" rx=\"1\"/>\u003crect x=\"8.5\" y=\"1\" width=\"3.5\" height=\"12\" rx=\"1\"/>\u003c/svg>\u003c/button>\n      \u003cinput type=\"range\" class=\"scrub\" id=\"scrub\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"Loop position\">\n      \u003cspan class=\"tc\" id=\"tc\">\u003cb>00:00:00\u003c/b> / 00:06:00\u003c/span>\n      \u003cspan class=\"chip\" title=\"The last frame flows straight into the first\">Seamless loop\u003c/span>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv class=\"section-h\">\u003ch2>Presets\u003c/h2>\u003cbutton class=\"link-btn\" id=\"savePresetToggle\">Save current as preset\u003c/button>\u003c/div>\n      \u003cdiv class=\"save-name\" id=\"saveNameRow\" hidden>\n        \u003cinput id=\"presetName\" type=\"text\" placeholder=\"Preset name\" maxlength=\"28\" aria-label=\"Preset name\">\n        \u003cbutton class=\"pill-btn\" id=\"savePresetBtn\">Save\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"presets\" id=\"presets\" style=\"margin-top:10px\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003caside class=\"panel\" aria-label=\"Controls\">\n    \u003cdiv class=\"group\">\n      \u003cdiv class=\"section-h\">\u003ch2>Style\u003c/h2>\u003cspan class=\"aside\" id=\"styleName\">Arcs\u003c/span>\u003c/div>\n      \u003cdiv class=\"styles\" id=\"styles\">\u003c/div>\n      \u003cp class=\"hint\" id=\"styleHint\">\u003c/p>\n      \u003cdiv class=\"shape-panel\" id=\"shapePanel\" hidden>\n        \u003cdiv class=\"shape-list\" id=\"shapeList\">\u003c/div>\n        \u003cdiv class=\"color-actions\" style=\"align-items:center\">\n          \u003clabel class=\"pill-btn upload-btn\" for=\"svgFile\">Upload SVG\u003c/label>\n          \u003cinput type=\"file\" id=\"svgFile\" accept=\".svg,image/svg+xml\" hidden>\n          \u003cspan class=\"hint\" id=\"shapeMsg\">or drop an SVG onto the preview\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ctl\">\n          \u003cdiv class=\"ctl-top\">\u003clabel>Shape motion\u003c/label>\u003c/div>\n          \u003cdiv class=\"seg\" id=\"shapeModeSeg\">\u003cbutton data-v=\"pulse\">Pulse\u003c/button>\u003cbutton data-v=\"flow\">Flow\u003c/button>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"ctl\">\n          \u003cdiv class=\"ctl-top\">\u003clabel>Rings\u003c/label>\u003c/div>\n          \u003cdiv class=\"seg\" id=\"ringModeSeg\">\u003cbutton data-v=\"scale\">Keep silhouette\u003c/button>\u003cbutton data-v=\"offset\">Follow edge\u003c/button>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"hint\">Pulse keeps the shape readable and makes its glow breathe. Flow sends spectrum rings outward from the edge. Filled shapes work best; stroke-only icons turn into thin outlines. Keep silhouette repeats the exact shape at every size; Follow edge traces a fixed distance from the outline, which softens corners and suits shapes with holes or deep notches.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"group\">\n      \u003cdiv class=\"section-h\">\u003ch2>Colors\u003c/h2>\u003cspan class=\"aside\" id=\"colorCount\">4 of 6\u003c/span>\u003c/div>\n      \u003cdiv class=\"ramp\" id=\"ramp\">\u003c/div>\n      \u003cdiv class=\"colors\" id=\"colors\">\u003c/div>\n      \u003cdiv class=\"color-actions\">\n        \u003cbutton class=\"pill-btn\" id=\"addColor\">Add color\u003c/button>\n        \u003cbutton class=\"pill-btn\" id=\"reverseColors\">Reverse\u003c/button>\n        \u003cbutton class=\"pill-btn\" id=\"randomColors\">Random palette\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"group\" id=\"motionGroup\">\n      \u003cdiv class=\"section-h\">\u003ch2>Motion\u003c/h2>\u003c/div>\n      \u003cdiv id=\"motionCtls\">\u003c/div>\n      \u003cp class=\"hint\">Speed is the number of full cycles in one loop, so any speed stays seamless.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"group\">\n      \u003cdiv class=\"section-h\">\u003ch2>Shape\u003c/h2>\u003c/div>\n      \u003cdiv id=\"shapeCtls\" style=\"display:flex;flex-direction:column;gap:12px\">\u003c/div>\n      \u003cdiv class=\"ctl\" id=\"ctl-mirror\">\n        \u003cdiv class=\"ctl-top\">\u003clabel>Color repeat\u003c/label>\u003c/div>\n        \u003cdiv class=\"seg\" id=\"mirrorSeg\">\n          \u003cbutton data-v=\"1\">Mirror\u003c/button>\u003cbutton data-v=\"0\">Wrap\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"group\">\n      \u003cdiv class=\"section-h\">\u003ch2>Export\u003c/h2>\u003c/div>\n      \u003cdiv class=\"seg\" id=\"formatSeg\">\u003cbutton data-v=\"mp4\">MP4\u003c/button>\u003cbutton data-v=\"gif\">GIF\u003c/button>\u003c/div>\n      \u003cdiv class=\"grid3\">\n        \u003cdiv class=\"field\">\u003clabel for=\"aspect\">Ratio\u003c/label>\n          \u003cselect id=\"aspect\">\u003coption>16:9\u003c/option>\u003coption>9:16\u003c/option>\u003coption>1:1\u003c/option>\u003coption>4:5\u003c/option>\u003coption>4:3\u003c/option>\u003c/select>\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"size\">Long side\u003c/label>\u003cselect id=\"size\">\u003c/select>\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"fps\">Frame rate\u003c/label>\u003cselect id=\"fps\">\u003c/select>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"field\" id=\"loopsField\">\u003clabel for=\"loops\">Loops in file\u003c/label>\n        \u003cselect id=\"loops\">\u003coption value=\"1\">1 loop (set your player to repeat)\u003c/option>\u003coption value=\"2\">2 loops\u003c/option>\u003coption value=\"3\">3 loops\u003c/option>\u003coption value=\"5\">5 loops\u003c/option>\u003coption value=\"10\">10 loops\u003c/option>\u003c/select>\u003c/div>\n      \u003cdiv class=\"summary\" id=\"summary\">\u003c/div>\n      \u003cbutton class=\"primary\" id=\"exportBtn\">Export MP4\u003c/button>\n      \u003cdiv class=\"progress\" id=\"progress\" hidden>\u003ci id=\"progressBar\">\u003c/i>\u003c/div>\n      \u003cp class=\"status\" id=\"status\" role=\"status\">\u003c/p>\n      \u003cdiv class=\"result\" id=\"result\" hidden>\n        \u003cdiv id=\"resultThumb\">\u003c/div>\n        \u003cdiv class=\"info\">\n          \u003cdiv class=\"name\" id=\"resultName\">\u003c/div>\n          \u003cdiv class=\"save-row\">\u003cbutton class=\"pill-btn\" id=\"saveAgain\">Save file\u003c/button>\u003cspan class=\"summary\" id=\"resultSize\">\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/aside>\n\u003c/main>\n\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js\">\u003c/script>\n\u003cscript>\n(() => {\n\"use strict\";\n\n/* ---------- Color math (sRGB hex \u003c-> OKLab) ---------- */\nconst s2l = c => c \u003c= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);\nconst l2s = c => c \u003c= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;\nfunction hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }\nfunction rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }\nfunction hexToOklab(hex){\n  const [R,G,B]=hexToRgb(hex).map(v=>s2l(v/255));\n  const l=Math.cbrt(0.4122214708*R+0.5363325363*G+0.0514459929*B);\n  const m=Math.cbrt(0.2119034982*R+0.6806995451*G+0.1073969566*B);\n  const s=Math.cbrt(0.0883024619*R+0.2817188376*G+0.6299787005*B);\n  return [0.2104542553*l+0.7936177850*m-0.0040720468*s, 1.9779984951*l-2.4285922050*m+0.4505937099*s, 0.0259040371*l+0.7827717662*m-0.8086757660*s];\n}\nfunction oklchToHex(L,C,h){\n  const a=C*Math.cos(h), b=C*Math.sin(h);\n  const l_=L+0.3963377774*a+0.2158037573*b, m_=L-0.1055613458*a-0.0638541728*b, s_=L-0.0894841775*a-1.2914855480*b;\n  const l=l_**3,m=m_**3,s=s_**3;\n  const r=4.0767416621*l-3.3077115913*m+0.2309699292*s, g=-1.2684380046*l+2.6097574011*m-0.3413193965*s, bb=-0.0041960863*l-0.7034186147*m+1.7076147010*s;\n  return rgbToHex(...[r,g,bb].map(v=>l2s(Math.max(0,Math.min(1,v)))*255));\n}\nconst validHex = h => /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h);\nconst normHex = h => { h=h.trim(); if(!h.startsWith('#')) h='#'+h; if(h.length===4) h='#'+h.slice(1).split('').map(x=>x+x).join(''); return h.toLowerCase(); };\n\n/* ---------- Styles & presets ---------- */\nconst STYLES = [\n  {id:'linear', label:'Linear', ctl:['angle','warp','mirror'], hint:'Colors run across the frame at the chosen angle and scroll along it.', roles:null},\n  {id:'radial', label:'Radial', ctl:['center','warp','mirror'], hint:'Rings pulse outward from the center point. Move the center off-frame for a sunrise glow.', roles:null},\n  {id:'conic', label:'Conic', ctl:['center','warp','mirror'], hint:'Colors sweep around the center like a dial. Distortion twists it into a spiral.', roles:null},\n  {id:'fluid', label:'Fluid', ctl:['angle','warp'], hint:'An organic, marbled field that folds through your colors.', roles:null},\n  {id:'waves', label:'Waves', ctl:['angle','warp','mirror'], hint:'Layered undulating bands, good for aurora and sea looks.', roles:null},\n  {id:'blobs', label:'Blobs', ctl:['center','soft'], hint:'The first color fills the background. Each other color becomes a soft blob drifting around the center.', roles:['Background','Blob','Blob','Blob','Blob','Blob']},\n  {id:'arcs', label:'Arcs', ctl:['center','soft','elements'], hint:'Stacked domes rising through the frame. The first color is the deep shadow, the last is the rim light.', roles:['Shadow','','','','','Rim light'], lastRole:true},\n  {id:'orbit', label:'Orbit', ctl:['center','soft','elements'], hint:'Dots circling like a loader, sharp at the top left and blurring as they travel. The first color is the background.', roles:['Background','Dot','Dot','Dot','Dot','Dot']},\n  {id:'shape', label:'Shape', ctl:['center','warp','soft'], hint:'Turns an SVG into a glowing spectrum. The first color fills the core of the shape, the last fades into the background. Distortion makes the shape wobble.', roles:['Core','','','','','Background'], lastRole:true},\n  {id:'fractal', label:'Fractal', ctl:['center','soft','elements','warp'], hint:'Soft color masses seen through fluted glass. The first color is the background, the last is the hottest core. Glass ribs and Refraction shape the glass.', roles:['Background','','','','','Core'], lastRole:true},\n];\nconst STYLE_IDX = Object.fromEntries(STYLES.map((s,i)=>[s.id,i]));\n\nconst LOOK_KEYS=['style','colors','cycles','duration','scale','angle','cx','cy','soft','elements','warp','grain','mirror','shape','shapeMode','ringMode','ribs','refract','blur'];\nconst LOOK_DEFAULTS={cycles:1,duration:6,scale:1,angle:90,cx:0,cy:0,soft:0.5,elements:5,warp:0,grain:0.05,mirror:true,shape:'heart',shapeMode:'pulse',ringMode:'scale',ribs:0,blur:0,refract:0.5};\nconst BUILTIN = [\n  {name:'Night Arcs', style:'arcs', colors:['#0a0f30','#121c63','#2a40c4','#b4ccff'], cycles:1,duration:8,scale:1.6,angle:90,cx:0,cy:-0.1,soft:0.45,elements:4,warp:0,grain:0.06,mirror:true},\n  {name:'Ink Bloom', style:'blobs', colors:['#fbf7f1','#1a338c','#0c1233'], cycles:1,duration:10,scale:1.3,angle:0,cx:0.2,cy:-0.12,soft:0.8,elements:5,warp:0,grain:0.05,mirror:true},\n  {name:'Orbit Loader', style:'orbit', colors:['#131a46','#3f73cf'], cycles:1,duration:3,scale:1,angle:0,cx:0,cy:0,soft:0.6,elements:6,warp:0,grain:0,mirror:true},\n  {name:'Spectrum Pulse', style:'radial', colors:['#6ef03c','#f5e51a','#f59a14','#e5231c','#8a3ee6','#2e8cf6'], cycles:1,duration:6,scale:1.7,angle:0,cx:0,cy:-0.62,soft:0.5,elements:5,warp:0.08,grain:0.04,mirror:true},\n  {name:'Heart Glow', style:'shape', shape:'heart', shapeMode:'pulse', colors:['#ff6a00','#ff2a3d','#ff4fc8','#3d5cff','#04050d'], cycles:1,duration:6,scale:1.25,cx:0,cy:0,soft:0.62,warp:0.1,grain:0.38,mirror:true},\n  {name:'Fluted Sun', style:'fractal', colors:['#fbf1e1','#ffc300','#ff7a00','#ff2200'], cycles:1,duration:10,scale:1.25,cx:0.3,cy:0,soft:0.85,elements:3,warp:0.1,grain:0.3,ribs:4,refract:0.55},\n  {na n}\nfunction buildStyles(){\n  const box=$('styles');\n  STYLES.forEach(s=>{\n    const b=document.createElement('button'); b.type='button'; b.className='style-btn'; b.dataset.style=s.id;\n    b.innerHTML=`\u003ccanvas>\u003c/canvas>\u003cspan>${s.label}\u003c/span>`;\n    b.addEventListener('click',()=>{ setStyle(s.id); syncAll(); });\n    box.append(b);\n  });\n}\nfunction buildSliders(){\n  Object.entries(SLIDERS).forEach(([k,d])=>{\n    const wrap=document.createElement('div'); wrap.className='ctl'; wrap.id='ctl-'+k;\n    wrap.innerHTML=`\u003cdiv class=\"ctl-top\">\u003clabel for=\"s-${k}\">${d.label}\u003c/label>\u003coutput id=\"o-${k}\">\u003c/output>\u003c/div>\u003cinput type=\"range\" id=\"s-${k}\" min=\"${d.min}\" max=\"${d.max}\" step=\"${d.step}\">`;\n    const inp=wrap.querySelector('input');\n    inp.addEventListener('input',()=>{ state[k]=parseFloat(inp.value); syncSlider(k); persist(); updateSummary(); if(k!=='duration'&&k!=='cycles') scheduleThumbs(); });\n    $(CTL_GROUP[k]==='motion'?'motionCtls':'shapeCtls').append(wrap);\n  });\n  $('motionCtls').style.cssText='display:flex;flex-direction:column;gap:12px';\n  // pair center X/Y side by side\n  const pair=document.createElement('div'); pair.className='two'; pair.id='centerPair';\n  $('ctl-cx').before(pair); pair.append($('ctl-cx'),$('ctl-cy'));\n}\nfunction syncSlider(k){\n  const inp=$('s-'+k), d=SLIDERS[k]; inp.value=state[k];\n  inp.style.setProperty('--p',((state[k]-d.min)/(d.max-d.min)*100)+'%');\n  $('o-'+k).textContent=d.fmt(state[k]);\n}\nfunction buildColors(){\n  const box=$('colors'); box.innerHTML='';\n  const st=STYLES[STYLE_IDX[state.style]]; const n=state.colors.length;\n  state.colors.forEach((hx,i)=>{\n    const row=document.createElement('div'); row.className='color-row';\n    let role='';\n    if(st.roles){ role = i===0?st.roles[0] : (i===n-1 && st.lastRole) ? st.roles[5] : st.roles[Math.min(i,4)]; }\n    row.innerHTML=`\u003cdiv class=\"swatch\" style=\"background:${hx}\">\u s[bi], ch=b.ch; const arr=Array.from(b.ids).sort((x,y)=>px[x*3+ch]-px[y*3+ch]); const mid=arr.length>>1;\n    boxes.splice(bi,1,stats({ids:Uint32Array.from(arr.slice(0,mid))}),stats({ids:Uint32Array.from(arr.slice(mid))}));\n  }\n  const pal=boxes.map(b=>{ let r=0,g=0,bb=0; for(const i of b.ids){ r+=px[i*3]; g+=px[i*3+1]; bb+=px[i*3+2]; } const c=b.ids.length; return [Math.round(r/c),Math.round(g/c),Math.round(bb/c)]; });\n  while(pal.length\u003cK) pal.push([0,0,0]);\n  return pal;\n}\nclass Bytes{ constructor(){ this.chunks=[]; this.buf=new Uint8Array(1\u003c\u003c16); this.p=0; }\n  byte(b){ if(this.p>=this.buf.length){ this.chunks.push(this.buf); this.buf=new Uint8Array(1\u003c\u003c16); this.p=0; } this.buf[this.p++]=b; }\n  u16(v){ this.byte(v&255); this.byte((v>>8)&255); }\n  str(s){ for(const ch of s) this.byte(ch.charCodeAt(0)); }\n  bytes(a){ for(let i=0;i\u003ca.length;i++) this.byte(a[i]); }\n  blob(type){ return new Blob([...this.chunks,this.buf.slice(0,this.p)],{type}); }\n}\nfunction lzw(out, idx, minCode){\n  const clear=1\u003c\u003cminCode, eoi=clear+1; let nBits=minCode+1, maxcode=(1\u003c\u003cnBits)-1, next=eoi+1, clearFlag=false;\n  const dict=new Map(); let acc=0, accBits=0; const block=new Uint8Array(255); let bl=0;\n  const flushByte=b=>{ block[bl++]=b; if(bl===255){ out.byte(255); out.bytes(block); bl=0; } };\n  const output=code=>{\n    acc|=code\u003c\u003caccBits; accBits+=nBits;\n    while(accBits>=8){ flushByte(acc&255); acc>>>=8; accBits-=8; }\n    if(clearFlag){ nBits=minCode+1; maxcode=(1\u003c\u003cnBits)-1; clearFlag=false; }\n    else if(next>maxcode){ nBits++; maxcode = nBits===12?4096:(1\u003c\u003cnBits)-1; }\n  };\n  out.byte(minCode); output(clear);\n  let prefix=idx[0];\n  for(let i=1;i\u003cidx.length;i++){\n    const k=idx[i]; const key=prefix*256+k; const hit=dict.get(key);\n    if(hit!==undefined){ prefix=hit; continue; }\n    output(prefix);\n    if(next\u003c4096){ dict.set(key,next++); }\n    else { dict.clear(); next=clear+2; clearFlag=true; output(clear); }\n    prefix=k;\n  }\n  output(prefix); output(eoi);\n  if(accBits>0) flushByte(acc&255);\n  if(bl>0){ out.byte(bl); out.bytes(block.subarray(0,bl)); }\n  out.byte(0);\n}\nconst BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];\n\n/* ---------- Export ---------- */\nlet busy=false, lastResult=null, downloads=null;\nif(window.claude && window.claude.use){ window.claude.use('downloads').then(d=>{ downloads=d; }).catch(()=>{}); }\nconst sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst yieldUI=()=>new Promise(r=>requestAnimationFrame(()=>r()));\nfunction setStatus(msg,cls=''){ const s=$('status'); s.textContent=msg; s.className='status '+cls; }\nfunction setProgress(f){ $('progress').hidden=f==null; if(f!=null) $('progressBar').style.width=(f*100).toFixed(1)+'%'; }\nfunction readFrame(gl,w,h,buf){ gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,buf); return buf; }\n\nasync function encodeGif(look,w,h,fps){\n  const frames=Math.round(look.duration*fps); const gl=offR.gl; const buf=new Uint8Array(w*h*4);\n  setStatus('Building color palette\u2026');\n  const samples=[]; const stepPx=Math.max(1,Math.floor(Math.sqrt(w*h/9000)));\n  for(let s=0;s\u003c8;s++){\n    offR.render(look,s/8,w,h,0); readFrame(gl,w,h,buf);\n    for(let y=0;y\u003ch;y+=stepPx) for(let x=(y*7)%stepPx;x\u003cw;x+=stepPx){ const i=(y*w+x)*4; samples.push(buf[i],buf[i+1],buf[i+2]); }\n  }\n  const pal=medianCut(new Uint8Array(samples),256);\n  const cache=new Int16Array(1\u003c\u003c18).fill(-1);\n  const nearest=(r,g,b)=>{ const key=((r>>2)\u003c\u003c12)|((g>>2)\u003c\u003c6)|(b>>2); let v=cache[key]; if(v>=0) return v; let bd=1e9; const rr=(r&~3)+2, gg=(g&~3)+2, bb=(b&~3)+2;\n    for(let i=0;i\u003c256;i++){ const p=pal[i]; const dr=p[0]-rr,dg=p[1]-gg,db=p[2]-bb; const d=dr*dr*3+dg*dg*4+db*db*2; if(d\u003cbd){bd=d;v=i;} } cache[key]=v; return v; };\n  const out=new Bytes(); out.str('GIF89a'); out.u16(w); out.u16(h); out.byte(0xF7); out.byte(0); out.byte(0);\n  pal.forEach(p=>{ out.byte(p[0]); out.byte(p[1]); out.byte(p[2]); });\n  out.byte(0x21); out.byte(0xFF); out.byte(11); out.str('NETSCAPE2.0'); out.byte(3); out.byte(1); out.u16(0); out.byte(0);\n  const delay=Math.round(100/fps); const idx=new Uint8Array(w*h); const amp=14;\n  for(let f=0;f\u003cframes;f++){\n    offR.render(look,f/frames,w,h,0); readFrame(gl,w,h,buf);\n    for(let y=0;y\u003ch;y++){ const sy=h-1-y; for(let x=0;x\u003cw;x++){ const i=(sy*w+x)*4; const d=(BAYER[(y&3)*4+(x&3)]/15-0.5)*amp;\n      const r=Math.max(0,Math.min(255,buf[i]+d)), g=Math.max(0,Math.min(255,buf[i+1]+d)), b=Math.max(0,Math.min(255,buf[i+2]+d)); idx[y*w+x]=nearest(r|0,g|0,b|0); } }\n    out.byte(0x21); out.byte(0xF9); out.byte(4); out.byte(0x04); out.u16(delay); out.byte(0); out.byte(0);\n    out.byte(0x2C); out.u16(0); out.u16(0); out.u16(w); out.u16(h); out.byte(0);\n    lzw(out,idx,8);\n    setProgress((f+1)/frames); setStatus(`Encoding GIF frame ${f+1} of ${frames}\u2026`);\n    await yieldUI();\n  }\n  out.byte(0x3B);\n  return {blob:out.blob('image/gif'), ext:'gif'};\n}\n\nasync function encodeMp4(look,w,h,fps,loops){\n  const frames=Math.round(look.duration*fps); const total=frames*loops; const bitrate=bitrateFor(w,h,fps);\n  if(window.VideoEncoder && window.Mp4Muxer){\n    const cands=['avc1.640033','avc1.4d0033','avc1.42e033','avc1.640034','avc1.640028','avc1.4d0028','avc1.42e01f'];\n    let codec=null;\n    for(const c of cands){ try{ const s=await VideoEncoder.isConfigSupported({codec:c,width:w,height:h,bitrate,framerate:fps}); if(s.supported){codec=c;break;} }catch(e){} }\n    if(codec){\n      const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:w,height:h,frameRate:fps},fastStart:'in-memory'});\n      let encErr=null;\n      const enc=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>{encErr=e;}});\n      enc.configure({codec,width:w,height:h,bitrate,framerate:fps,latencyMode:'quality',avc:{format:'avc'}});\n      const us=1e6/fps;\n      for(let i=0;i\u003ctotal;i++){\n        if(encErr) throw encErr;\n        offR.render(look,(i%frames)/frames,w,h,1);\n        const vf=new VideoFrame(offR.c,{timestamp:Math.round(i*us),duration:Math.round(us)});\n        enc.encode(vf,{keyFrame:i%(fps*2)===0}); vf.close();\n        while(enc.encodeQueueSize>6) await sleep(2);\n        if(i%3===0){ setProgress((i+1)/total); setStatus(`Encoding MP4 frame ${i+1} of ${total}\u2026`); await yieldUI(); }\n      }\n      await enc.flush(); if(encErr) throw encErr; muxer.finalize();\n      return {blob:new Blob([muxer.target.buffer],{type:'video/mp4'}), ext:'mp4'};\n    }\n  }\n  // Fallback: real-time MediaRecorder\n  if(!window.MediaRecorder || !offR.c.captureStream) throw new Error('This browser can\\'t encode video. Try a current Chrome, Edge or Safari, or export a GIF.');\n  const mime=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));\n  if(!mime) throw new Error('This browser can\\'t record video. Try a current Chrome, Edge or Safari, or export a GIF.');\n  const ext=mime.startsWith('video/mp4')?'mp4':'webm';\n  offR.render(look,0,w,h,1);\n  const stream=offR.c.captureStream(0); const track=stream.getVideoTracks()[0];\n  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bitrate}); const parts=[];\n  rec.ondataavailable=e=>{ if(e.data.size) parts.push(e.data); };\n  const done=new Promise(r=>rec.onstop=r);\n  rec.start();\n  const t0=performance.now();\n  for(let i=0;i\u003ctotal;i++){\n    offR.render(look,(i%frames)/frames,w,h,1); track.requestFrame && track.requestFrame();\n    const target=t0+(i+1)*1000/fps; const wait=target-performance.now(); if(wait>0) await sleep(wait);\n    if(i%3===0){ setProgress((i+1)/total); setStatus(`Recording frame ${i+1} of ${total} in real time\u2026`); }\n  }\n  rec.stop(); await done;\n  return {blob:new Blob(parts,{type:mime.split(';')[0]}), ext};\n}\n\nasync function offerSave(){\n  if(!lastResult) return;\n  if(!downloads){\n    const a=document.createElement('a'); a.href=URL.createObjectURL(lastResult.blob); a.download=lastResult.name;\n    document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);\n    setStatus('Downloaded '+lastResult.name,'ok'); return;\n  }\n  try{\n    await downloads.save({filename:lastResult.name, data:lastResult.blob});\n    setStatus('Saved '+lastResult.name,'ok');\n  }catch(e){\n    const code=e&&e.code;\n    if(code==='declined') setStatus('Save cancelled. Use \u201cSave file\u201d when you\\'re ready.');\n    else if(code==='rate_limited') setStatus('A save prompt is already open.');\n    else if(code==='too_large') setStatus('The file is too large to save here. Try a smaller size or fewer loops.','err');\n    else setStatus('Saving isn\\'t available in this view.','err');\n  }\n}\n$('saveAgain').addEventListener('click',offerSave);\n\n$('exportBtn').addEventListener('click',async()=>{\n  if(busy) return; busy=true; $('exportBtn').disabled=true; $('result').hidden=true;\n  const look={}; LOOK_KEYS.forEach(k=>look[k]=Array.isArray(state[k])?state[k].slice():state[k]);\n  const {w,h}=exportDims(); const fps=curFps(); const t0=performance.now();\n  setProgress(0);\n  try{\n    const r = state.format==='gif' ? await encodeGif(look,w,h,fps) : await encodeMp4(look,w,h,fps,state.loops);\n    const name=`loopwash-${look.style}-${w}x${h}.${r.ext}`;\n    lastResult={blob:r.blob,name};\n    const url=URL.createObjectURL(r.blob);\n    const th=$('resultThumb'); th.innerHTML='';\n    const el = r.ext==='gif' ? Object.assign(document.createElement('img'),{src:url,alt:'Exported GIF'}) : Object.assign(document.createElement('video'),{src:url,muted:true,loop:true,autoplay:true,playsInline:true});\n    el.className='thumb'; th.append(el);\n    $('resultName').textContent=name;\n    const mb=r.blob.size/1e6; $('resultSize').textContent=(mb\u003c1?(r.blob.size/1e3).toFixed(0)+' KB':mb.toFixed(1)+' MB')+` \u00b7 ${((performance.now()-t0)/1000).toFixed(1)} s to encode`;\n    $('result').hidden=false; setProgress(null);\n    setStatus(r.ext==='webm'?'Done. This browser could only record WebM, not MP4.':(downloads?'Done. Confirm the save prompt to download.':'Done.'),'ok');\n    offerSave();\n  }catch(e){\n    console.error(e); setProgress(null);\n    setStatus((e&&e.message)?e.message:'Export failed. Try a smaller size.','err');\n  }finally{ busy=false; $('exportBtn').disabled=false; }\n});\n\n/* ---------- Init ---------- */\nstateRef=state; ensureCustom(state.customSvg); if(state.shape==='custom'&&!state.customSvg) state.shape='heart';\nbuildStyles(); buildSliders(); syncAll(); renderPresets(); renderStyleThumbs();\nrequestAnimationFrame(t=>{ last=t; frame(t); });\n})();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"};
const TOOLS = [
  {id:'type', name:'Typeshift', kind:'Kinetic type', color:'--c-type'},
  {id:'carousel', name:'Carrossel', kind:'Carousels', color:'--c-carousel'},
  {id:'dots', name:'Dotwash', kind:'Halftone', color:'--c-dots'},
  {id:'gradient', name:'Loopwash', kind:'Gradients', color:'--c-gradient'},
];
const tabs = document.getElementById('tabs'), frames = document.getElementById('frames');
const loaded = {};
TOOLS.forEach((t, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.id = 'tab-' + t.id; b.setAttribute('role', 'tab');
  b.style.setProperty('--tc', `var(${t.color})`);
  b.innerHTML = `<span class="dot" aria-hidden="true"></span>${t.name}<small>${t.kind}</small>`;
  b.title = `${t.name} (Alt+${i + 1})`;
  b.addEventListener('click', () => show(t.id));
  tabs.appendChild(b);
});
let current = null;
function show(id){
  if (!APPS[id]) id = TOOLS[0].id;
  if (!loaded[id]) {
    const f = document.createElement('iframe');
    f.title = TOOLS.find(t => t.id === id).name;
    f.setAttribute('allow', 'fullscreen; clipboard-write');
    f.srcdoc = APPS[id];
    f.addEventListener('load', () => { try { f.contentWindow.addEventListener('keydown', hotkey); } catch (e) {} });

  }

  TOOLS.forEach(t => document.getElementById('tab-' + t.id).setAttribute('aria-selected', String(t.id === id)));
  current = id;
  try { localStorage.setItem('atelie-tab', id); } catch (e) {}
  if (location.hash.slice(1) !== id) try { history.replaceState(null, '', '#' + id); } catch (e) {}
  try { loaded[id].contentWindow.focus(); } catch (e) {}
}
function hotkey(e){
  if (!e.altKey || e.ctrlKey || e.metaKey) return;
  const n = parseInt(e.code.replace('Digit', ''), 10);
  if (n >= 1 && n <= TOOLS.length) { e.preventDefault(); show(TOOLS[n - 1].id); }
}
document.addEventListener('keydown', hotkey);
tabs.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = TOOLS.findIndex(t => t.id === current), j = (i + (e.key === 'ArrowRight' ? 1 : -1) + TOOLS.length) % TOOLS.length;
  show(TOOLS[j].id); document.getElementById('tab-' + TOOLS[j].id).focus();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (APPS[h] && h !== current) show(h); });
let start = location.hash.slice(1);
if (!APPS[start]) { try { start = localStorage.getItem('atelie-tab') || ''; } catch (e) { start = ''; } }
show(start);
})();
